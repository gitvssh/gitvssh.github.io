name: Check and deploy blog

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# contents: write is what publishes — the build pushes dist/ to the gh-pages
# branch. The Pages-artifact permissions (pages, id-token) are gone with the
# artifact upload they served.
permissions:
  contents: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One job, not two: the homelab scale set runs at most one runner, so a
  # separate deploy job would queue behind this one.
  build:
    runs-on: homelab-blog
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
      PUBLIC_GA_MEASUREMENT_ID: ${{ vars.GA_MEASUREMENT_ID }}
      PUBLIC_CLOUDFLARE_WEB_ANALYTICS_TOKEN: ${{ vars.CLOUDFLARE_WEB_ANALYTICS_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"

      - name: Check public repository boundary
        run: node scripts/check-public-repo.mjs

      - name: Use pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "11.7.0"
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check and build
        run: pnpm run build

      - name: Publish to gh-pages
        if: github.repository == 'gitvssh/gitvssh.github.io' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd dist
          # Without CNAME the custom domain is dropped on the next deploy;
          # without .nojekyll GitHub runs Jekyll, which hides _astro/.
          echo blog.damecasol.com > CNAME
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "deploy: ${GITHUB_SHA}"
          # Feed the token through a credential helper reading the environment,
          # so it never appears in argv or in the stored remote URL.
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c credential.helper='!f() { printf "username=x-access-token\npassword=%s\n" "$GH_TOKEN"; }; f' \
            push -q --force origin gh-pages
